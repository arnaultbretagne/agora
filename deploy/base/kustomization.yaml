# S11 Step 5 — the deployment, as files an operator applies rather than commands they remember.
#
# The base is complete and unopinionated about environment: images are placeholders an overlay
# pins by digest, and every value that differs between environments is a ConfigMap or Secret the
# overlay supplies. Nothing here reaches into a cluster; `kubectl apply -k` does.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agora-system

resources:
  # Both namespaces are declared in contracts/k8s, which every overlay pulls in: declaring
  # agora-system here too made kustomize refuse the whole build as a duplicate resource id.
  - control-plane.yaml
  - runtime-control.yaml
  - broker.yaml
  - web.yaml
  - onecli.yaml
  - poddisruptionbudgets.yaml
  - ../../contracts/catalogue

# The catalogue ConfigMap is generated by `contracts/catalogue/kustomization.yaml`, next to the
# files themselves: kustomize refuses file sources outside a kustomization's own directory, and
# generating it from here made `kubectl apply -k` fail on load restrictions.
