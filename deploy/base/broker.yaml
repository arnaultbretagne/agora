# The Broker is the only holder of the OneCLI control key and of every Agent bearer (ADR 0009). It
# is also the relay: a harness Pod's egress goes through it and carries no credential of its own.
#
# Its ServiceAccount and RBAC live in contracts/k8s/30-broker-rbac.yaml, like runtime-control's:
# the authority is a reviewed contract, not a deployment detail, and declaring it in both places
# made the kustomize build fail as a duplicate.
# The Broker is the only holder of the OneCLI control key and of every Agent bearer (ADR 0009). It
# is also the relay: a harness Pod's egress goes through it and carries no credential of its own.
apiVersion: v1
kind: Service
metadata:
  name: broker
spec:
  selector:
    app: broker
  ports:
    - name: http
      port: 8091
      targetPort: http
    - name: relay
      port: 8444
      targetPort: relay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      serviceAccountName: broker
      # The relay reads its token at startup to resolve Pod identity by source IP (P10). With this
      # false — as it was before this deployment was ever run — the process throws on boot.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: broker
          image: ghcr.io/arnaultbretagne/agora-engine-broker:overlay-pins-this-by-digest
          env:
            - name: PORT
              value: '8091'
            - name: RELAY_PORT
              value: '8444'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: agora-database, key: ENGINE_URL }
            # These four names are the ones apps/broker/src/main.ts reads. The manifest used to
            # invent its own (ONECLI_BASE_URL, ONECLI_CONTROL_KEY); the process would have started
            # and then refused every request, which is the worst of both.
            - name: ONECLI_URL
              value: http://onecli.agora-onecli.svc.cluster.local:10254
            - name: ONECLI_GATEWAY_URL
              value: http://onecli.agora-onecli.svc.cluster.local:10255
            - name: ONECLI_API_KEY
              valueFrom:
                secretKeyRef: { name: agora-onecli, key: CONTROL_KEY }
            # The key the Broker's private store encrypts Agent bearers with. Its own, not OneCLI's:
            # losing it costs the stored bearers, losing OneCLI's costs everything.
            - name: BROKER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: agora-broker, key: BROKER_ENCRYPTION_KEY }
            - name: AGORA_NAMESPACE
              value: agora-runs
            - name: POLICY_CAPABILITIES_PATH
              value: /etc/agora/capabilities.json
            - name: POLICY_GRANT_MAPPINGS_PATH
              value: /etc/agora/grant-mappings.json
            - name: POLICY_EGRESS_HOSTS_PATH
              value: /etc/agora/egress-hosts.json
          ports:
            - name: http
              containerPort: 8091
            - name: relay
              containerPort: 8444
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - name: catalogue
              mountPath: /etc/agora
              readOnly: true
      volumes:
        - name: catalogue
          configMap: { name: agora-catalogue }
