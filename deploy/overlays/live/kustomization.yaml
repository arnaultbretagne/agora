# The live overlay: what actually runs on the g4 cluster.
#
# Two things distinguish it from `dev/`. It pins real published digests — every image in this file
# exists in the registry and was built by a named workflow run. And it does NOT deploy OneCLI: this
# cluster already runs one, with the agents, grants, gateway CA and encryption key that make
# credential injection work at all. A second, empty OneCLI would answer every request and inject
# nothing, which is the failure mode hardest to read from inside a harness Pod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../../contracts/k8s
  - postgres.yaml

images:
  - name: ghcr.io/arnaultbretagne/agora-engine-control-plane
    newName: ghcr.io/arnaultbretagne/agora-engine-control-plane
    digest: sha256:d8b1993aa4b76eaaf586a50848a8d8a129702f4660dbfc46f11c2bf239cdb7ac
  - name: ghcr.io/arnaultbretagne/agora-engine-runtime-control
    newName: ghcr.io/arnaultbretagne/agora-engine-runtime-control
    digest: sha256:c57971cb5bae2ca5ebbfb3a4288bab9c8d3d447e5a449abe74bf837a9693222b
  - name: ghcr.io/arnaultbretagne/agora-engine-broker
    newName: ghcr.io/arnaultbretagne/agora-engine-broker
    digest: sha256:8217e358cac0bb2a310b58cb29b2775a6ab7c00ada935e01cfbabb9f083f9619
  - name: ghcr.io/arnaultbretagne/agora-engine-web
    newName: ghcr.io/arnaultbretagne/agora-engine-web
    digest: sha256:fcae54610a2fe3d88ba0e4d4135387625f29634b3e63416407e55e888cea68ec

patches:
  # The environment owns the namespaces, because it owns their security posture: PodSecurity
  # enforcement, the platform profile label, the LimitRange and the quota are decisions about this
  # cluster, not about the product. infra-k8s declares both (apps/agora-system, apps/agora-runs) and
  # this overlay must not fight it — two GitOps sources reconciling one object take turns undoing
  # each other for ever. `dev/` still creates them, so it stands alone.
  - target: { kind: Namespace, name: agora-system }
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: agora-system
      $patch: delete
  - target: { kind: Namespace, name: agora-runs }
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: agora-runs
      $patch: delete
  # OneCLI runs in agora-onecli on this cluster and is reached there (see the Broker's ONECLI_URL
  # in base). These three deletions are what "reuse the existing one" looks like in kustomize.
  - target: { kind: Deployment, name: onecli }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: onecli
      $patch: delete
  - target: { kind: Service, name: onecli }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: onecli
      $patch: delete
  - target: { kind: PersistentVolumeClaim, name: onecli-data }
    patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: onecli-data
      $patch: delete
