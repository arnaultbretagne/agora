# The gateway's configuration for Agora's MCP server, as docs/specs/credentials.md ("Agora's MCP") asks infra-k8s for
# it: the CONNECT bind, the internal bind's listener and its JWT as infra-k8s deploys them (apps/agora-gateway/
# gateway.yaml), the `agora` route of the spec, and the `internet` route. Only the paths, the ports and the server's
# address are the test's, the placeholders agora-gateway.test.ts fills in. In the cluster the backend is the server's
# Service, server.agora.svc.cluster.local:8082, which only the gateway reaches.
frontendPolicies:
  accessLog:
    add:
      execution: jwt.sub
      grants: jwt.jti
config:
  adminAddr: 127.0.0.1:${ADMIN_PORT}
  statsAddr: "off"
  readinessAddr: 127.0.0.1:${READINESS_PORT}
binds:
  - port: ${CONNECT_PORT}
    tunnelProtocol: connect
    listeners: []
  - port: 443
    mode: internal
    listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: ${CA_CERT}
          key: ${CA_KEY}
        policies:
          jwtAuth:
            mode: strict
            location:
              expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
            issuer: agora
            audiences: [agora-gateway]
            jwks: { file: ${JWKS} }
        routes:
            - name: agora
              hostnames: [mcp.agora.internal]
              backends:
                - host: ${AGORA_MCP}
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                transformations:
                  request:
                    set:
                      x-agora-execution: 'jwt.sub'
            - name: internet
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && jwt.grants.exists(g, g.host == "*" && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
