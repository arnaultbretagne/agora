# The gateway's configuration for the cluster, as docs/specs/credentials.md ("Kubernetes") asks infra-k8s for it:
# the CONNECT bind, the internal bind's listener and its JWT as infra-k8s deploys them (apps/agora-gateway/
# gateway.yaml), the `kubernetes` route of the spec, and the `internet` route. Only the paths, the ports and the
# API server's address are the test's, the placeholders kubernetes-gateway.test.ts fills in. In the cluster the
# backend is the API server's Service, kubernetes.default.svc.cluster.local:443, its root the cluster's CA
# (ConfigMap kube-root-ca.crt), and the token the gateway's own ServiceAccount's, projected and rotated.
frontendPolicies:
  accessLog:
    add:
      execution: jwt.sub
      grants: jwt.jti
config:
  adminAddr: 127.0.0.1:${ADMIN_PORT}
  statsAddr: "off"
  readinessAddr: 127.0.0.1:${READINESS_PORT}
binds:
  - port: ${CONNECT_PORT}
    tunnelProtocol: connect
    listeners: []
  - port: 443
    mode: internal
    listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: ${CA_CERT}
          key: ${CA_KEY}
        policies:
          jwtAuth:
            mode: strict
            location:
              expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
            issuer: agora
            audiences: [agora-gateway]
            jwks: { file: ${JWKS} }
        routes:
            - name: kubernetes
              hostnames: [kubernetes.agora.internal]
              backends:
                - host: ${KUBE_API}
                  policies:
                    backendTLS:
                      root: ${KUBE_CA}
                      hostname: kubernetes.default.svc
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                backendAuth:
                  key:
                    value: { file: ${KUBE_TOKEN} }
                    location: { header: { name: authorization, prefix: "Bearer " } }
            - name: internet
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && jwt.grants.exists(g, g.host == "*" && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
