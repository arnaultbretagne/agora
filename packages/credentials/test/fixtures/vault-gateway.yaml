# The gateway's configuration as infra-k8s deploys it (apps/agora-gateway/gateway.yaml, pull request #295 at
# 8080318), cut to what the vault needs: the CONNECT bind, the internal bind's listener and its JWT, the `vault`
# route and the `internet` route. Copied as is; only the paths, the ports and the vault's address are the test's,
# the placeholders vault-gateway.test.ts fills in. GitHub's `x-gateway-grant` and the other providers' routes are
# left out: they take no part in the vault's requests.
frontendPolicies:
  accessLog:
    add:
      execution: jwt.sub
      grants: jwt.jti
config:
  adminAddr: 127.0.0.1:${ADMIN_PORT}
  statsAddr: "off"
  readinessAddr: 127.0.0.1:${READINESS_PORT}
binds:
  - port: ${CONNECT_PORT}
    tunnelProtocol: connect
    listeners: []
  - port: 443
    mode: internal
    listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: ${CA_CERT}
          key: ${CA_KEY}
        policies:
          jwtAuth:
            mode: strict
            location:
              expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
            issuer: agora
            audiences: [agora-gateway]
            jwks: { file: ${JWKS} }
        routes:
            - name: vault
              hostnames: [vault.bretagne.dev]
              backends:
                - mcp:
                    targets:
                      - name: vault
                        mcp:
                          host: ${VAULT_MCP}
                        policies:
                          backendAuth:
                            key:
                              value: { file: ${VAULT_TOKEN} }
                              location: { header: { name: authorization, prefix: "Bearer " } }
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                mcpAuthorization:
                  rules:
                    - allow: 'jwt.grants.exists(g, g.host == "vault.bretagne.dev" && (!has(g.tools) || (has(mcp.tool) && mcp.tool.name in g.tools)))'
            - name: internet
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && jwt.grants.exists(g, g.host == "*" && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
