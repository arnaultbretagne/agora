# The gateway's configuration for the previews, as docs/specs/credentials.md ("Previews") asks infra-k8s for it:
# the CONNECT bind, the internal bind's listener and its JWT as infra-k8s deploys them (apps/agora-gateway/
# gateway.yaml), the `previews` route of the spec, and the `internet` route. Only the paths, the ports and the
# backend are the test's, the placeholders previews-gateway.test.ts fills in. In the cluster the backend is
# `dynamic` with `backendTLS: {}`: the preview's public name, Traefik, which sends the requests marked
# `x-agora-gate: gateway` to the preview's gateway gate. Here the backend is that gate itself.
frontendPolicies:
  accessLog:
    add:
      execution: jwt.sub
      grants: jwt.jti
config:
  adminAddr: 127.0.0.1:${ADMIN_PORT}
  statsAddr: "off"
  readinessAddr: 127.0.0.1:${READINESS_PORT}
binds:
  - port: ${CONNECT_PORT}
    tunnelProtocol: connect
    listeners: []
  - port: 443
    mode: internal
    listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: ${CA_CERT}
          key: ${CA_KEY}
        policies:
          jwtAuth:
            mode: strict
            location:
              expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
            issuer: agora
            audiences: [agora-gateway]
            jwks: { file: ${JWKS} }
        routes:
            - name: previews
              hostnames: ["*.preview.bretagne.dev"]
              backends:
                - host: ${GATE}
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, has(g.hostPattern) && request.host.matches(g.hostPattern) && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                requestHeaderModifier:
                  set:
                    x-agora-gate: gateway
                backendAuth:
                  key:
                    value: { file: ${GATEWAY_TOKEN} }
                    location: { header: { name: authorization, prefix: "Bearer " } }
            - name: internet
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && jwt.grants.exists(g, g.host == "*" && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
