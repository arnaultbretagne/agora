# The cluster as an execution reads it (docs/specs/credentials.md, "Kubernetes"): the bridge names this file in
# the adapter's KUBECONFIG. No credential: the gateway sets the cluster's, for the executions whose token grants
# `kubernetes:read`. The user is a name with no password, only so that kubectl does not stop to ask for one on
# stdin (client-go prompts for a user it cannot identify, `canIdentifyUser`): kubectl then sends `Basic` of
# `agora:`, which the gateway replaces, as it replaces every Authorization. No proxy-url: client-go then takes
# HTTPS_PROXY, the bridge's outbound proxy. The only root trusted is the gateway's, which the template mounts.
apiVersion: v1
kind: Config
clusters:
  - name: agora
    cluster:
      server: https://kubernetes.agora.internal
      certificate-authority: /etc/agora/credential-proxy/ca.pem
users:
  - name: agora
    user:
      username: agora
contexts:
  - name: agora
    context:
      cluster: agora
      user: agora
current-context: agora
