# The cluster as an execution reads it (docs/specs/credentials.md, "Kubernetes"): the bridge names this file in
# the adapter's KUBECONFIG. No credential: kubectl sends none, and the gateway sets the cluster's, for the
# executions whose token grants `kubernetes:read`. No proxy-url: kubectl (client-go) then takes HTTPS_PROXY,
# the bridge's outbound proxy. The only root trusted is the gateway's, which the template mounts.
apiVersion: v1
kind: Config
clusters:
  - name: agora
    cluster:
      server: https://kubernetes.agora.internal
      certificate-authority: /etc/agora/credential-proxy/ca.pem
users:
  - name: agora
    user: {}
contexts:
  - name: agora
    context:
      cluster: agora
      user: agora
current-context: agora
