apiVersion: v1
kind: Pod
metadata:
  name: onecli
  namespace: agora-onecli-test
  labels:
    app: onecli
spec:
  containers:
    - name: onecli
      image: ghcr.io/onecli/onecli@sha256:7a4fef94337b3c7b16a044998eee342d3e6a6ab1b18c2c4b54e66d050337201b
      env:
        - name: DATABASE_URL
          value: postgres://postgres:onecli-test-only@onecli-postgres:5432/onecli
        - name: APP_URL
          value: http://onecli.agora-onecli-test.svc.cluster.local:10254
        - name: GATEWAY_PORT
          value: "10255"
        # Without this, OneCLI defaults its advertised gateway host to `host.docker.internal`
        # (a Docker-Desktop convention) — unreachable from this k0s/containerd cluster's Pods.
        # No scheme here: the server prepends `http://<bearer>@` itself; a scheme in this value
        # produces a broken double-scheme proxy URL (verified live).
        - name: GATEWAY_BASE_URL
          value: onecli.agora-onecli-test.svc.cluster.local:10255
        - name: LOG_LEVEL
          value: info
      ports:
        - containerPort: 10254
          name: api
        - containerPort: 10255
          name: gateway
      volumeMounts:
        - name: data
          mountPath: /app/data
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      readinessProbe:
        httpGet:
          path: /v1/health
          port: 10254
        initialDelaySeconds: 5
        periodSeconds: 3
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: onecli-app-data
