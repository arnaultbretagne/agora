apiVersion: v1
kind: Pod
metadata:
  name: onecli-postgres
  namespace: agora-onecli-test
  labels:
    app: onecli-postgres
spec:
  containers:
    - name: postgres
      image: postgres:17-alpine
      env:
        - name: POSTGRES_PASSWORD
          value: onecli-test-only
        - name: POSTGRES_DB
          value: onecli
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        initialDelaySeconds: 2
        periodSeconds: 2
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: onecli-postgres-data
