apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-runtime-egress
  namespace: agora-p04-test
spec:
  podSelector:
    matchLabels:
      agora.dev/app: session-runtime
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: fake-relay
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
