openapi: 3.1.0
info:
  title: Agora Session Runtime Control API
  version: 0.1.0
  description: Internal idempotent lifecycle API. It never accepts arbitrary process configuration.
servers:
  - url: /v1
security:
  - mutualTLS: []
paths:
  /agents:
    get:
      operationId: listLaunchableAgents
      description: Safe controller-authoritative selection projection; no runtime process details.
      responses:
        '200':
          description: Agent IDs and exact versions accepted for new materializations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, registryRevision]
                properties:
                  registryRevision:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LaunchableAgent'
  /sessions/{sessionId}/runtime:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    put:
      operationId: materializeSessionRuntime
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterializeSessionRuntimeRequest'
      responses:
        '200':
          description: Existing compatible Session Runtime state returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeStatus'
        '202':
          description: Provisioning started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeStatus'
        '409':
          $ref: '#/components/responses/Problem'
    get:
      operationId: getSessionRuntime
      responses:
        '200':
          description: Current live state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeStatus'
        '404':
          description: The Session Runtime is currently not materialized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: dematerializeSessionRuntime
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: Deletion/revocation in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRuntimeStatus'
        '204':
          description: Already absent.
  /sessions/{sessionId}/runtime/acp-connections:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: openACPConnection
      description: >
        Mint one Session-bound, single-purpose connection after the Session Runtime is ready.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          description: Ephemeral ACP bridge connection minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACPBridgeEndpoint'
        '409':
          $ref: '#/components/responses/Problem'
  /sessions/{sessionId}/runtime/custody-snapshots:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: captureCustody
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [syncedThroughSeq]
              properties:
                syncedThroughSeq:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        '201':
          description: Immutable snapshot committed; Pod remains alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodySnapshotRef'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Typed controller error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    LaunchableAgent:
      type: object
      additionalProperties: false
      required: [agentId, runtimeDefinitionVersion, label, description, availability]
      properties:
        agentId:
          type: string
        runtimeDefinitionVersion:
          type: string
        label:
          type: string
        description:
          type: string
        availability:
          type: string
          enum: [enabled, unavailable, deprecated]
    MaterializeSessionRuntimeRequest:
      type: object
      additionalProperties: false
      required:
        - agentId
        - runtimeDefinitionVersion
        - workspaceMountRef
        - executionGrantRef
      properties:
        agentId:
          type: string
          minLength: 1
          maxLength: 120
        runtimeDefinitionVersion:
          type: string
          minLength: 1
        workspaceMountRef:
          type: string
          minLength: 1
          maxLength: 300
        executionGrantRef:
          type: string
          minLength: 1
          maxLength: 500
          writeOnly: true
          x-sensitive: true
        restoreFrom:
          type: [string, 'null']
          format: uuid
        traceparent:
          type: string
    SessionRuntimeStatus:
      type: object
      additionalProperties: false
      required: [sessionId, agentId, runtimeDefinitionVersion, state]
      properties:
        sessionId:
          type: string
          format: uuid
        agentId:
          type: string
        runtimeDefinitionVersion:
          type: string
        state:
          type: string
          enum: [absent, provisioning, ready, capturing, terminating, failed]
        podUid:
          type: [string, 'null']
        failure:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Problem'
    ACPBridgeEndpoint:
      type: object
      additionalProperties: false
      required: [transport, url, credential, expiresAt]
      properties:
        transport:
          type: string
          enum: [websocket, streamable-http]
        url:
          type: string
          format: uri
        credential:
          type: string
          readOnly: true
          x-sensitive: true
        expiresAt:
          type: string
          format: date-time
    CustodySnapshotRef:
      type: object
      additionalProperties: false
      required:
        - snapshotId
        - sessionId
        - generation
        - captureRequestId
        - formatId
        - formatVersion
        - adapterVersion
        - syncedThroughSeq
        - sha256
        - sizeBytes
        - createdAt
      properties:
        snapshotId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
        captureRequestId:
          type: string
          format: uuid
        formatId:
          type: string
        formatVersion:
          type: string
        adapterVersion:
          type: string
        syncedThroughSeq:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
