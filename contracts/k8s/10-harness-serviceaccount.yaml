# S6 — the harness Pod's own identity: deliberately granted nothing (no Role/RoleBinding names
# it anywhere). k8s-pod-spec.ts already sets automountServiceAccountToken: false, so no token is
# ever mounted; this ServiceAccount exists so that guarantee does not also depend on falling back
# to the namespace's "default" account, whose own grants are outside this contract's control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harness
  namespace: agora-runs

# The registry credential — and ONLY that. `imagePullSecrets` is not a grant to anything running in
# the Pod: the kubelet uses it to fetch the image and the container never sees it. The images are
# private packages, so without this the Pod never starts and the event says ImagePullBackOff, which
# reads like a broken image rather than a missing credential.
imagePullSecrets:
  - name: ghcr-pull
