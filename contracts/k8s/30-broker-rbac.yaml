# S7 — the Broker's own identity (P10: relay identity resolution needs read-only get/list on Pods
# in agora-runs — nothing else, no write authority at all, unlike runtime-control). Deployed in
# agora-system alongside runtime-control (00-namespace.yaml / 10-runtime-control-rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker
  namespace: agora-system
  annotations:
    agora.dev/authority: >-
      OneCLI control key and per-Agent bearers, plus the read-only Pod authority below and nothing
      else: the relay resolves a connecting Pod's identity from its source IP, which this cluster
      has no service mesh to assert otherwise (P10). It can neither create nor delete a Pod.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: broker-pods-read
  namespace: agora-runs
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: broker-pods-read
  namespace: agora-runs
subjects:
  - kind: ServiceAccount
    name: broker
    namespace: agora-system
roleRef:
  kind: Role
  name: broker-pods-read
  apiGroup: rbac.authorization.k8s.io
