# S7 — the one narrow exception to 20-default-deny-networkpolicy.yaml: a harness Pod may reach the
# Broker's relay port and nothing else (ADR 0009 — the Pod never gets a direct path to OneCLI or to
# any provider; every egress goes through the relay's own authorization decision). Matches whatever
# labels the Broker Deployment carries (`app: broker`, port 8444) — not itself declared here, same
# as runtime-control's own Deployment (contracts/k8s only carries namespace/RBAC/NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harness-egress-to-relay
  namespace: agora-runs
spec:
  podSelector:
    matchLabels:
      agora.dev/app: runtime-controlled
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agora-system
          podSelector:
            matchLabels:
              app: broker
      ports:
        - port: 8444
          protocol: TCP
    # runtime-control's owner API: the Pod polls its own evidence endpoint to learn the launch gate
    # opened, and answers custody requests on the same host. Without this the Pod waits at the seam
    # for ever — which reads, from every other component, exactly like a Pod that never started.
    # It is a narrow allow to ONE Service port, and it carries no authority: what the Pod may ask
    # for there is decided by runtime-control from the Pod's own name, not from what it says.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agora-system
          podSelector:
            matchLabels:
              app: runtime-control
      ports:
        - port: 8090
          protocol: TCP
    # DNS — without it the harness Pod cannot even resolve the relay's Service name (kube-system's
    # own namespace label is cluster-managed, not this catalogue's to set).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
