# The catalogue as a ConfigMap, generated where the catalogue actually lives.
#
# It is here rather than in `deploy/base/kustomization.yaml` because kustomize refuses file sources
# outside a kustomization's own directory — with load restrictions on, `kubectl apply -k
# deploy/overlays/dev` failed outright, which is exactly the kind of thing only a real deployment
# finds. Generating here and consuming the directory as a resource keeps the reviewed catalogue in
# one place and the restriction satisfied, with no copy to drift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: agora-catalogue
    files:
      - harness-definitions.json
      - capabilities.json
      - runtime-settings.json
      - retention-settings.json
      - grant-mappings.json
      - egress-hosts.json

# A catalogue change must produce a NEW ConfigMap name, so a rollout actually happens and every
# worker moves to the same revision at once (SESSION-A11). Suffixing by content hash is what makes
# "publish a revision" and "restart onto it" the same event.
generatorOptions:
  disableNameSuffixHash: false
