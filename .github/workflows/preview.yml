# A preview's image (apps/server/README.md, "Preview"; docs/specs/preview.md, V1): for a pull request labelled
# `preview` whose branch is in this repository, the server's image of its head commit, built, tried as a
# preview, then published as ghcr.io/<owner>/agora-server:<full commit SHA> — when the label is set, then at
# each push while it stays. infra-k8s's catalogue of previews (`source: main`) takes that tag. A pull request
# without the label, or from a fork, publishes nothing.
#
# Two jobs, so that the pull request's code never runs while holding write on packages (README.md in this
# folder): `build` builds and tries the image with a token that only reads the repository, no registry login
# and no token kept in its checkout; `publish` runs none of the pull request's code, checks the image handed
# over is the one built, and pushes it under that one tag.
name: preview

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# None by default: each job declares the least it needs. No value of the event (a branch's name, a pull
# request's title) is written into a `run:` script: what one needs reaches it through `env:`.
permissions: {}

jobs:
  build:
    # Labelled, from this repository; on `labeled`, only for this label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The pull request's last commit wins: a run for an older one is cancelled, whichever of its jobs runs.
    # A run these jobs skip takes no place here.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      id: ${{ steps.built.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Build the image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          tags: agora-server:test
          cache-from: type=gha,scope=agora-server
      # Taken as built, before `npm ci` and the pull request's scripts run: `publish` pushes this image alone.
      - name: Its image ID
        id: built
        run: echo "id=$(docker image inspect agora-server:test --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Start it as a preview, alone with its database, and drive its client
        run: |
          npm ci --no-audit --no-fund
          npx -w @agora/web playwright install --only-shell chromium
          node scripts/try-preview.ts agora-server:test
      - name: Save it for the publishing job
        run: docker save --output agora-server.tar agora-server:test
      - uses: actions/upload-artifact@v4
        with:
          name: agora-server-image
          path: agora-server.tar
          retention-days: 1

  # The image just tried, as it is. Nothing of the pull request is checked out or run here: the image's
  # bytes are loaded, never started, and the one tag below is pushed by name.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # To push the image to ghcr.io.
      packages: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/agora-server
      # The pull request's head, not the merge commit GitHub makes for it: the commit the preview names.
      SHA: ${{ github.event.pull_request.head.sha }}
      ID: ${{ needs.build.outputs.id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agora-server-image
      - name: Load it, and check it is the image built
        run: |
          docker load --input agora-server.tar
          loaded=$(docker image inspect agora-server:test --format '{{.Id}}')
          if [ -z "$ID" ] || [ "$loaded" != "$ID" ]; then
            echo "::error::The image handed over is $loaded, not $ID, the one built: nothing published."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish it under the commit's SHA
        run: |
          docker tag "$ID" "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA"
          {
            echo '### agora-server, preview'
            echo ''
            echo '```'
            echo "$IMAGE:$SHA"
            docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r '"'"$IMAGE"'@" + .digest'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
