name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Build harnesses/claude-code''s image (S8 Step 1 acceptance: image builds in CI)'
        run: docker build -f harnesses/claude-code/image/Dockerfile -t agora-harness-claude-code:ci .
      - name: The pinned CLI and adapter both report their own version (field-findings §2.2)
        run: |
          docker run --rm --entrypoint claude agora-harness-claude-code:ci --version
          docker run --rm --entrypoint node agora-harness-claude-code:ci \
            /usr/local/lib/node_modules/@agentclientprotocol/claude-agent-acp/dist/index.js --cli --version
      - name: Runs as a non-root numeric UID (S6 field-findings §4)
        run: |
          uid=$(docker run --rm --entrypoint id agora-harness-claude-code:ci -u)
          test "$uid" = "10001"
      - name: 'Build harnesses/codex''s image (S10 Step 1: the second reviewed harness)'
        run: docker build -f harnesses/codex/image/Dockerfile -t agora-harness-codex:ci .
      - name: The pinned codex adapter reports its own version, and its CLI is present
        run: |
          docker run --rm --entrypoint node agora-harness-codex:ci \
            /usr/local/lib/node_modules/@agentclientprotocol/codex-acp/dist/index.js --version
      - name: The codex image runs as the same non-root numeric UID
        run: |
          uid=$(docker run --rm --entrypoint id agora-harness-codex:ci -u)
          test "$uid" = "10001"
      # S11 Step 4 — supply chain. An SBOM per harness image, produced from the image itself rather
      # than from the lockfile: what shipped is what is in the layers, and those two can differ.
      # Kept as build artifacts here; publishing them with provenance belongs to whatever pushes the
      # images to a registry, which this workflow deliberately does not do.
      - name: SBOM for both harness images
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:latest agora-harness-claude-code:ci -o spdx-json > sbom-claude-code.spdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:latest agora-harness-codex:ci -o spdx-json > sbom-codex.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: harness-sboms
          path: sbom-*.spdx.json
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Maintenance connection; db-reset drops and recreates AGORA_DATABASE on this server.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AGORA_DATABASE: agora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repository rules
        run: npm run check
      - name: Build
        run: npm run build
      - name: Apply database schema from scratch
        run: npm run db:reset
      - name: Test
        run: npm run test --workspaces --if-present

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: agora-runtime-control
      - name: Apply the runtime-control manifests
        # `-k`, not `-f`: the directory is a kustomization now (a deployment overlay pulls it in as
        # a resource), and `-f` on a directory would try to apply kustomization.yaml as an object.
        run: kubectl apply -k contracts/k8s/
      - name: Namespaces and the default-deny NetworkPolicy exist
        run: |
          kubectl get namespace agora-runs agora-system
          kubectl get networkpolicy default-deny-all -n agora-runs
          kubectl get serviceaccount runtime-control -n agora-system
          kubectl get serviceaccount harness -n agora-runs
      - name: runtime-control's ServiceAccount has exactly its declared Pod authority
        run: |
          set -e
          sa=system:serviceaccount:agora-system:runtime-control
          for verb in get list watch create delete; do
            kubectl auth can-i "$verb" pods -n agora-runs --as="$sa" | grep -qx yes
          done
          kubectl auth can-i get nodes --as="$sa" | grep -qx yes
      - name: runtime-control's ServiceAccount has no authority beyond that (least privilege)
        run: |
          set -e
          sa=system:serviceaccount:agora-system:runtime-control
          ! kubectl auth can-i get secrets -n agora-runs --as="$sa" | grep -qx yes
          ! kubectl auth can-i list nodes --as="$sa" | grep -qx yes
          ! kubectl auth can-i delete nodes --as="$sa" | grep -qx yes
          ! kubectl auth can-i get pods -n agora-system --as="$sa" | grep -qx yes
      - name: the harness ServiceAccount carries no authority at all
        run: |
          set -e
          sa=system:serviceaccount:agora-runs:harness
          ! kubectl auth can-i get pods -n agora-runs --as="$sa" | grep -qx yes
          ! kubectl auth can-i get secrets -n agora-runs --as="$sa" | grep -qx yes
      - name: the broker ServiceAccount can only read Pods — no write, no Nodes
        run: |
          set -e
          sa=system:serviceaccount:agora-system:broker
          kubectl auth can-i get pods -n agora-runs --as="$sa" | grep -qx yes
          kubectl auth can-i list pods -n agora-runs --as="$sa" | grep -qx yes
          ! kubectl auth can-i create pods -n agora-runs --as="$sa" | grep -qx yes
          ! kubectl auth can-i delete pods -n agora-runs --as="$sa" | grep -qx yes
          ! kubectl auth can-i watch pods -n agora-runs --as="$sa" | grep -qx yes
          ! kubectl auth can-i get nodes --as="$sa" | grep -qx yes
          ! kubectl auth can-i get secrets -n agora-runs --as="$sa" | grep -qx yes
      - name: a harness Pod may reach only the relay port, nothing else on the network
        run: |
          kubectl get networkpolicy harness-egress-to-relay -n agora-runs
      - name: a real Pod round-trips through the runtime-control identity (create, observe, delete)
        run: |
          set -e
          sa=system:serviceaccount:agora-system:runtime-control
          kubectl run smoke-test --image=registry.k8s.io/pause:3.9 -n agora-runs --as="$sa" \
            --overrides='{"spec":{"serviceAccountName":"harness","automountServiceAccountToken":false}}'
          kubectl wait --for=condition=Ready pod/smoke-test -n agora-runs --timeout=60s
          kubectl get pod smoke-test -n agora-runs --as="$sa"
          kubectl delete pod smoke-test -n agora-runs --as="$sa" --wait=true
