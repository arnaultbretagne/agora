name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Maintenance connection; db-reset drops and recreates AGORA_DATABASE on this server.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      AGORA_DATABASE: agora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repository rules
        run: npm run check
      - name: Build
        run: npm run build
      - name: Apply database schema from scratch
        run: npm run db:reset
      - name: Test
        run: npm run test --workspaces --if-present
