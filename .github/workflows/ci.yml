# The CI: checks every workspace on each push and each PR to the base branch, then — on
# pushes only — builds and tries the server and the harness images, and publishes them by digest from
# the base branch or a run by hand. infra-k8s pins the digests (apps/agora-sandboxes, apps/agora), never
# a tag. A pull request publishes no image here: one labelled `preview` gets the server's from
# preview.yml. A branch's push holds no write on packages (this folder's README.md): its images are
# built and tried by `try`, the same steps as `image` with a token that only reads them.
#
# Nothing is done twice (README.md, "Check and build"): after a merge, a tree already checked at the
# pull request's head is not checked again; an image whose inputs already have one is not built again.
name: ci

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
    paths: [apps/**, harnesses/**, packages/**, roles/**, toolbelt/**, package.json, package-lock.json, tsconfig.base.json, .github/workflows/ci.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:

# None by default: each job declares the least it needs. No value a branch's author or an event chooses
# (a ref's name, a payload's field, an input) is written into a `run:` script: it reaches it through
# `env:`, as a variable the shell never parses as code.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To find the pull request a merge comes from, and whether its head passed.
      actions: read
      pull-requests: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOG_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A merge whose tree is exactly its pull request's head, which a push run of this workflow passed:
      # the same files were checked there.
      - name: Already checked at the pull request's head?
        id: checked
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          for head in $(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" -q '.[].head.sha'); do
            [ "$(gh api "repos/$REPO/git/commits/$head" -q .tree.sha)" = "$tree" ] || continue
            passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=push&status=success" -q .total_count)
            if [ "${passed:-0}" -gt 0 ]; then
              echo "::notice::Same tree as $head, checked by a run that passed: not checked again."
              echo "done=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - if: steps.checked.outputs.done != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # The client's browser tests (apps/web/test/browser) drive Playwright's headless Chromium. The
      # runner's image already holds the libraries Chromium needs: no system package is installed,
      # so a run never depends on Ubuntu's mirrors.
      - name: Typecheck and test every workspace, the client in a browser
        if: steps.checked.outputs.done != 'true'
        run: |
          npm ci --no-audit --no-fund
          npx -w @agora/web playwright install --only-shell chromium
          npm run check

  # The images `image` and `try` build: the server's, and one per folder of harnesses/ holding a Dockerfile
  # (scripts/inputs.ts, `images()`, which propose-infra.ts reads too), each saying whether it is built on the
  # toolbelt, which `toolbelt` builds before them. A harness is added as a folder, never
  # in this file: the App agents push with cannot change it.
  images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.list.outputs.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: List the images
        id: list
        run: |
          include=$(node scripts/inputs.ts --matrix)
          echo "include=$include" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "- `\(.name)`: \(.dockerfile)"' <<<"$include" | tee -a "$GITHUB_STEP_SUMMARY"

  # The toolbelt (toolbelt/README.md), the base image of the harnesses built on it: built, tried as a sandbox runs
  # it (toolbelt/smoke.sh) and published like the images below, under its inputs' fingerprint, before them; never
  # proposed to infra-k8s. Its env and steps are also `toolbelt-try`'s, below, which publishes nothing.
  toolbelt:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read and push the toolbelt on ghcr.io.
      packages: write
      # To sign and store the build's provenance (actions/attest-build-provenance).
      id-token: write
      attestations: write
    env: &toolbelt-env
      PUBLISH: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      NAME: agora-toolbelt
      IMAGE: ghcr.io/${{ github.repository_owner }}/agora-toolbelt
    steps: &toolbelt-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Its image, if its inputs already have one
        id: existing
        run: |
          inputs=$(node scripts/inputs.ts "$NAME")
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          if manifest=$(docker buildx imagetools inspect "$IMAGE:inputs-$inputs" --format '{{json .Manifest}}' 2>/dev/null); then
            echo "digest=$(jq -r .digest <<<"$manifest")" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:inputs-$inputs already exists: not built again."
          fi

      - if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@v3

      - name: Build the toolbelt locally
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: toolbelt/Dockerfile
          load: true
          tags: agora-toolbelt:test
          cache-from: type=gha,scope=agora-toolbelt
          cache-to: type=gha,mode=max,scope=agora-toolbelt

      - name: Try it as a sandbox runs it
        if: steps.existing.outputs.digest == ''
        run: toolbelt/smoke.sh agora-toolbelt:test

      - id: push
        if: steps.existing.outputs.digest == '' && env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: toolbelt/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:inputs-${{ steps.existing.outputs.inputs }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=agora-toolbelt

      - if: steps.existing.outputs.digest == '' && env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
        run: |
          {
            echo "### $NAME"
            echo ''
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A branch's push: `toolbelt`'s env and steps, which publish nothing here (PUBLISH is false), with a token that
  # only reads packages, as `try`'s.
  toolbelt-try:
    needs: check
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To find the toolbelt by its inputs on ghcr.io.
      packages: read
    env: *toolbelt-env
    steps: *toolbelt-steps

  # Builds, tries and publishes the images: on the base branch or a run by hand alone, the only runs
  # whose token writes packages. Its env, matrix and steps are also `try`'s, below (YAML anchors).
  image:
    needs: [check, images, toolbelt]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read and push the images on ghcr.io.
      packages: write
      # To sign and store the build's provenance (actions/attest-build-provenance).
      id-token: write
      attestations: write
    # PUBLISH is true on the base branch or a run by hand, so always in this job; false in `try`.
    env: &image-env
      PUBLISH: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      NAME: ${{ matrix.name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    strategy: &image-matrix
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.include) }}
    steps: &image-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image is tagged with its inputs' fingerprint (scripts/inputs.ts): if that tag exists, the
      # image is the same, and its digest is taken as is.
      - name: Its image, if its inputs already have one
        id: existing
        run: |
          inputs=$(node scripts/inputs.ts "$NAME")
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          if manifest=$(docker buildx imagetools inspect "$IMAGE:inputs-$inputs" --format '{{json .Manifest}}' 2>/dev/null); then
            echo "digest=$(jq -r .digest <<<"$manifest")" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:inputs-$inputs already exists: not built again."
          fi

      # A harness built on the toolbelt is built on the one of the same inputs: on ghcr.io, where `toolbelt`
      # published it from the base branch; on a branch that has not reached it yet, built here with the
      # runner's own Docker, whose next build sees it — then so is the harness.
      - name: The toolbelt it is built on
        id: toolbelt
        if: steps.existing.outputs.digest == '' && matrix.toolbelt
        env:
          TOOLBELT: ghcr.io/${{ github.repository_owner }}/agora-toolbelt
        run: |
          inputs=$(node scripts/inputs.ts agora-toolbelt)
          if manifest=$(docker buildx imagetools inspect "$TOOLBELT:inputs-$inputs" --format '{{json .Manifest}}' 2>/dev/null); then
            echo "image=$TOOLBELT@$(jq -r .digest <<<"$manifest")" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::$TOOLBELT:inputs-$inputs is not published."
            exit 1
          else
            echo "::notice::$TOOLBELT:inputs-$inputs does not exist yet: built here."
            docker build -t agora-toolbelt:test -f toolbelt/Dockerfile .
            echo "image=agora-toolbelt:test" >> "$GITHUB_OUTPUT"
            echo "local=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.digest == '' && steps.toolbelt.outputs.local != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build the image locally
        if: steps.existing.outputs.digest == '' && steps.toolbelt.outputs.local != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.name }}:test
          build-args: TOOLBELT_IMAGE=${{ steps.toolbelt.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Build the image locally, on the toolbelt built here
        if: steps.existing.outputs.digest == '' && steps.toolbelt.outputs.local == 'true'
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --build-arg TOOLBELT_IMAGE=agora-toolbelt:test -t "$NAME:test" -f "$DOCKERFILE" .

      # A harness image starts as in the cluster: non-root, read-only root, HOME on tmpfs, and is ready
      # while the adapter process runs; Agora initializes it over the authenticated relay.
      - name: Start the harness image read-only and probe it
        if: steps.existing.outputs.digest == '' && matrix.harness
        run: |
          openssl genpkey -algorithm ed25519 -out key.pem
          openssl pkey -in key.pem -pubout -out pub.pem
          docker run -d --name harness --read-only --tmpfs /home/harness:uid=10001,gid=10001 --tmpfs /tmp \
            --cap-drop ALL -e POD_NAME=sbx-ci -e BRIDGE_PUBLIC_KEY="$(cat pub.pem)" -p 8080:8080 \
            "$NAME:test"
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/info)" = 401
          docker logs harness

      - name: Try the toolbelt in it as a sandbox runs it
        if: steps.existing.outputs.digest == '' && matrix.toolbelt
        run: toolbelt/smoke.sh "$NAME:test"

      - name: Start the server far enough to fail on its configuration
        if: steps.existing.outputs.digest == '' && !matrix.harness
        run: |
          docker run --rm --read-only --cap-drop ALL agora-server:test 2>&1 | tee out.txt || true
          grep -q 'SANDBOX_NAMESPACE is required' out.txt

      # apps/server/README.md, "Preview": the same image as a preview, in a network that lets only its
      # database through, its client driven in a browser (docs/specs/preview.md, V4 to V6).
      - name: Start the server as a preview, alone with its database, and drive its client
        if: steps.existing.outputs.digest == '' && !matrix.harness
        run: |
          npm ci --no-audit --no-fund
          npx -w @agora/web playwright install --only-shell chromium
          node scripts/try-preview.ts agora-server:test

      - id: push
        if: steps.existing.outputs.digest == '' && env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:inputs-${{ steps.existing.outputs.inputs }}
          build-args: TOOLBELT_IMAGE=${{ steps.toolbelt.outputs.image }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}

      - if: steps.existing.outputs.digest == '' && env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
        run: |
          {
            echo "### $NAME"
            echo ''
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p digests && echo "$DIGEST" > "digests/$NAME"

      # For the infra proposal below: one file per image, named after it.
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 7

  # A branch's push (agents push theirs): `image`'s env, matrix and steps, which publish nothing here
  # (PUBLISH is false). Its token only reads packages, to find an image by its inputs: the branch's code
  # those steps run — scripts/inputs.ts, the build, the images, the client — cannot push an image, so
  # none can wait under the `inputs-` tag the base branch would then take as its own.
  try:
    needs: [check, images, toolbelt-try]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To find an image by its inputs on ghcr.io.
      packages: read
    env: *image-env
    strategy: *image-matrix
    steps: *image-steps

  # Proposes the images just published to infra-k8s (README.md, "Images in the cluster"): one pull
  # request, kept up to date, for the base branch; one per branch for a run started by hand. Those whose
  # inputs did not change are left as they are. Merging stays the operator's.
  propose-infra:
    needs: image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Only to check out this repository: infra-k8s is written with its own token, given only to the steps
    # that need it — though the infra checkout keeps it in infra/.git/config for the push, so later steps
    # of this job can read it there. The branch's name reaches the scripts as REF.
    permissions:
      contents: read
    env:
      REF: ${{ github.ref_name }}
    steps:
      - name: Check the token
        id: token
        env:
          INFRA_K8S_TOKEN: ${{ secrets.INFRA_K8S_TOKEN }}
        run: |
          if [ -z "$INFRA_K8S_TOKEN" ]; then
            echo "::notice::INFRA_K8S_TOKEN is not set: no infra-k8s pull request proposed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: arnaultbretagne/infra-k8s
          token: ${{ secrets.INFRA_K8S_TOKEN }}
          path: infra
      - if: steps.token.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Write the digests into infra-k8s
        id: propose
        if: steps.token.outputs.ok == 'true'
        run: node scripts/propose-infra.ts --infra infra --digests digests --ref "$REF" --sha "$GITHUB_SHA" > body.md
      - name: Open or update the pull request
        if: steps.token.outputs.ok == 'true' && steps.propose.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_K8S_TOKEN }}
        run: |
          if [ "$REF" = main ]; then branch=agora/images; else branch="agora/images-$(printf '%s' "$REF" | tr -c 'a-zA-Z0-9-' '-')"; fi
          title="feat(agora): images from $REF ${GITHUB_SHA::7}"
          cd infra
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -qam "$title" -m "Proposed by Agora's CI from arnaultbretagne/agora@${GITHUB_SHA}."
          git push -f origin "$branch"
          if gh pr view "$branch" --repo arnaultbretagne/infra-k8s --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --repo arnaultbretagne/infra-k8s --title "$title" --body-file ../body.md
          else
            gh pr create --repo arnaultbretagne/infra-k8s --base main --head "$branch" --title "$title" --body-file ../body.md
          fi
          gh pr view "$branch" --repo arnaultbretagne/infra-k8s --json url -q .url >> "$GITHUB_STEP_SUMMARY"
