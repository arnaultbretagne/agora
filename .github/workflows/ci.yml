# The CI: checks every workspace on each push and each PR to the base branch, then — on
# pushes only — builds, tries and publishes the server and the harness images by digest. infra-k8s
# pins the digests (apps/agora-sandboxes, apps/agora), never a tag.
name: ci

on:
  push:
    branches: [design/agora-foundations, 'feat/**', 'fix/**', 'chore/**']
    paths: [apps/**, harnesses/**, packages/**, package.json, package-lock.json, tsconfig.base.json, .github/workflows/ci.yml]
  pull_request:
    branches: [design/agora-foundations]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOG_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The client's browser tests (apps/web/test/browser) drive Playwright's headless Chromium.
      - name: Typecheck and test every workspace, the client in a browser
        run: |
          npm ci --no-audit --no-fund
          npx -w @agora/web playwright install --with-deps --only-shell chromium
          npm run check

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: agora-server, dockerfile: apps/server/Dockerfile, harness: false }
          - { name: agora-harness-mock, dockerfile: harnesses/mock/Dockerfile, harness: true }
          - { name: agora-harness-claude-code, dockerfile: harnesses/claude-code/Dockerfile, harness: true }
          - { name: agora-harness-opencode, dockerfile: harnesses/opencode/Dockerfile, harness: true }
          - { name: agora-harness-codex, dockerfile: harnesses/codex/Dockerfile, harness: true }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.name }}:test
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # A harness image starts as in the cluster: non-root, read-only root, HOME on tmpfs, and is ready
      # while the adapter process runs; Agora initializes it over the authenticated relay.
      - name: Start the harness image read-only and probe it
        if: matrix.harness
        run: |
          openssl genpkey -algorithm ed25519 -out key.pem
          openssl pkey -in key.pem -pubout -out pub.pem
          docker run -d --name harness --read-only --tmpfs /home/harness:uid=10001,gid=10001 --tmpfs /tmp \
            --cap-drop ALL -e POD_NAME=sbx-ci -e BRIDGE_PUBLIC_KEY="$(cat pub.pem)" -p 8080:8080 \
            ${{ matrix.name }}:test
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/info)" = 401
          docker logs harness

      - name: Start the server far enough to fail on its configuration
        if: ${{ !matrix.harness }}
        run: |
          docker run --rm --read-only --cap-drop ALL agora-server:test 2>&1 | tee out.txt || true
          grep -q 'SANDBOX_NAMESPACE is required' out.txt

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record the digest
        run: |
          {
            echo '### ${{ matrix.name }}'
            echo ''
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p digests && echo "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.name }}"

      # For the infra proposal below: one file per image, named after it.
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 7

  # Proposes the images just published to infra-k8s (README.md, "Images in the cluster"): one pull
  # request, kept up to date, for the base branch; one per branch for a run started by hand. Those whose
  # inputs did not change are left as they are. Merging stays the operator's.
  propose-infra:
    needs: image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/design/agora-foundations')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INFRA_K8S_TOKEN: ${{ secrets.INFRA_K8S_TOKEN }}
    steps:
      - name: Check the token
        id: token
        run: |
          if [ -z "$INFRA_K8S_TOKEN" ]; then
            echo "::notice::INFRA_K8S_TOKEN is not set: no infra-k8s pull request proposed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: arnaultbretagne/infra-k8s
          token: ${{ secrets.INFRA_K8S_TOKEN }}
          path: infra
      - if: steps.token.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Write the digests into infra-k8s
        id: propose
        if: steps.token.outputs.ok == 'true'
        run: node scripts/propose-infra.ts --infra infra --digests digests --ref "${{ github.ref_name }}" --sha "${{ github.sha }}" > body.md
      - name: Open or update the pull request
        if: steps.token.outputs.ok == 'true' && steps.propose.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_K8S_TOKEN }}
        run: |
          if [ "${{ github.ref_name }}" = design/agora-foundations ]; then branch=agora/images; else branch="agora/images-$(echo '${{ github.ref_name }}' | tr -c 'a-zA-Z0-9-' '-')"; fi
          title="feat(agora): images from ${{ github.ref_name }} ${GITHUB_SHA::7}"
          cd infra
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -qam "$title" -m "Proposed by Agora's CI from arnaultbretagne/agora@${GITHUB_SHA}."
          git push -f origin "$branch"
          if gh pr view "$branch" --repo arnaultbretagne/infra-k8s --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --repo arnaultbretagne/infra-k8s --title "$title" --body-file ../body.md
          else
            gh pr create --repo arnaultbretagne/infra-k8s --base main --head "$branch" --title "$title" --body-file ../body.md
          fi
          gh pr view "$branch" --repo arnaultbretagne/infra-k8s --json url -q .url >> "$GITHUB_STEP_SUMMARY"
