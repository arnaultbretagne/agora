name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agora_contracts
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agora_contracts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # packages/store-pg and packages/custody create their own uniquely named disposable
          # database(s) on this server via their own migration runner (see packages/store-pg/test/
          # support.ts) — independent from the "Apply database contracts" smoke test below, which
          # targets agora_contracts directly.
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Apply database contracts
        env:
          PGPASSWORD: postgres
        run: >-
          psql
          --host=127.0.0.1
          --username=postgres
          --dbname=agora_contracts
          --set=ON_ERROR_STOP=1
          --file=contracts/database/001-initial.sql
          --file=contracts/database/002-access.sql
